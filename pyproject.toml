[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pysqlbridge"
version = "2.1.0"
description = "Advertise arbitrary data sources over the wire as if they were SQL Server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Smith Edward" }]
keywords = [
    "sql-server", "tds", "odbc", "excel", "xlsx", "access", "accdb",
    "power-bi", "csv", "json", "rest-api", "bridge", "read-only",
]
# No license classifier: the license field above is an SPDX expression, and
# setuptools refuses the two together.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Generating the self-signed certificate for the login tunnel. The floor
    # is where the suite was actually run, not a guess: 42.0.0 is the oldest
    # release tested green, and it is also where not_valid_after_utc exists.
    "cryptography>=42",
    # Reading .accdb and .mdb. The Jet storage engine in pure Python, with no
    # dependencies of its own and the same Python floor as this, so an Access
    # database is served on any machine the rest of this runs on. The
    # alternative was the database engine Microsoft ships, reached through
    # COM or ODBC, which is a separate download that installs in one bit
    # width and is not on Linux at all. The floor is the version the suite
    # was actually run against.
    "pyopenvba>=5.2.3",
    # Windows Authentication. AcceptSecurityContext performs the SPNEGO
    # exchange and validates the client against the local account database or
    # the domain, so this project never handles a credential itself. Marked
    # for Windows because SSPI is Windows; the protocol layers below it are
    # portable and their tests run anywhere.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/WilliamSmithEdward/pySQLbridge"
Repository = "https://github.com/WilliamSmithEdward/pySQLbridge"
Issues = "https://github.com/WilliamSmithEdward/pySQLbridge/issues"

[project.scripts]
pysqlbridge = "pysqlbridge.server:main"

[project.optional-dependencies]
# What the suite needs, and nothing else. Kept apart from dev so that CI
# does not download PyInstaller onto ten matrix cells to run pytest.
test = ["pytest>=8"]
dev = [
    "pysqlbridge[test]",
    # Building the single-file executable. Not needed to run or test the
    # bridge, only to package it.
    "pyinstaller>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
