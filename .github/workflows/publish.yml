name: Publish

# A version tag publishes to PyPI and creates the GitHub release.
#
# Trusted Publishing: PyPI is told, once, in its own web interface, that this
# repository, this workflow file and the pypi environment may publish this
# project. GitHub then signs a short-lived token for the run and PyPI checks
# it. No API token is created, stored or rotated anywhere, which is the point.
# Renaming this file or the environment breaks it.
#
# To release, write the version's section in CHANGELOG.md, then:
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# The tag is the version in pyproject.toml with a v in front, and the build
# refuses a mismatch rather than publishing it. The release waits on the
# suite, Security and the Malware scan of the tagged commit.
#
# Started by hand, it is always a dry run: it builds, tests, scans and
# assembles the release files exactly as a release would, and uploads them
# as the release-preview artifact instead of publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      # First, so a mistyped tag fails in seconds. A tag that says one thing
      # and a package that says another puts a release on PyPI under a number
      # nobody chose, and a number on PyPI can never be used again.
      - name: Verify the tag matches the package version
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tagged" != "$built" ]; then
            echo "tag v$tagged does not match version $built in pyproject.toml"
            exit 1
          fi

      - name: Install the build tools
        run: python -m pip install --require-hashes -r .github/requirements/build.txt

      - name: Build the wheel and the sdist
        run: python -m build --no-isolation

      - name: Check what PyPI would be shown
        run: python -m twine check dist/*

      - name: Run the suite before anything is published
        run: |
          python -m pip install --require-hashes -r .github/requirements/test.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest tests -q

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The tagged commit's scans. A finding the accepted list does not account
  # for fails this job, and nothing is published.
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # ClamAV and YARA-X over the tagged commit's files and the packages built
  # from it, held to their own accepted list the same way.
  malware-scan:
    name: Malware scan
    uses: ./.github/workflows/malware-scan.yml
    permissions:
      contents: read

  publish:
    name: Publish to PyPI
    needs: [build, security, malware-scan]
    # Only for a pushed tag. A run started by hand, even on a tag, would
    # upload whatever version pyproject.toml held, and a version on PyPI can
    # never be used again.
    if: ${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment is where PyPI's trusted publisher is pinned, and where
    # a required reviewer can be added if a release should need one.
    environment:
      name: pypi
      url: https://pypi.org/p/pysqlbridge
    permissions:
      # What lets GitHub mint the short-lived token PyPI checks. Nothing else
      # in this file needs it, and nothing else gets it.
      id-token: write
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Signed build provenance: `gh attestation verify <file> --owner
      # WilliamSmithEdward` shows which commit and run built a distribution.
      - name: Attest the distributions
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # The signed bundle goes on the GitHub release too, so a download can be
      # checked offline: gh attestation verify <file> --bundle <bundle>.
      - name: Keep the provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # On a dry run `publish` is skipped; this job still assembles the release
  # and uploads it as an artifact, and only the last step is skipped.
  github-release:
    name: Create GitHub release
    needs: [build, publish, security, malware-scan]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.security.result == 'success' && needs.malware-scan.result == 'success'
      && (needs.publish.result == 'success'
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # creating the release
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download the security report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report
          path: security-report/

      - name: Download the malware report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: malware-report
          path: security-report/

      - name: Download the provenance bundle
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: provenance/

      # Both reports and what they were made from, named for the release:
      # pysqlbridge-2.1.3-security-report.md, pysqlbridge-2.1.3-semgrep.sarif,
      # pysqlbridge-2.1.3-malware-report.md, pysqlbridge-2.1.3-clamav.json,
      # and the provenance bundle as pysqlbridge-2.1.3.sigstore.json.
      - name: Name the reports after the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$DRY_RUN" = true ]; then
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          for file in security-report/*; do
            mv "$file" "security-report/pysqlbridge-$VERSION-$(basename "$file")"
          done
          if [ "$DRY_RUN" != true ]; then
            test "$(find provenance -type f | wc -l)" = 1
            mv provenance/* "provenance/pysqlbridge-$VERSION.sigstore.json"
          fi

      # The version's section of CHANGELOG.md, the notes written for it.
      - name: Extract the changelog section for this version
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$DRY_RUN" = true ]; then
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release $VERSION" > release_notes.md
          fi
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Keep what the release would carry
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            dist/
            security-report/
            release_notes.md
          if-no-files-found: error

      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The title is the tag and nothing else. The headline is in the body.
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            dist/*
            security-report/*
            provenance/*
          fail_on_unmatched_files: true
