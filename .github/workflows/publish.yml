# Publish to PyPI when a version tag is pushed.
#
# Trusted Publishing: PyPI is told, once, in its own web interface, that this
# repository and this workflow may publish this project. GitHub then signs a
# short-lived token for the run and PyPI checks it. No API token is created,
# stored or rotated anywhere, which is the point.
#
# To release:
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# The tag is the version in pyproject.toml with a v in front, and the job
# refuses the release rather than publishing a mismatch.
#
# Started by hand, it is a dry run: it builds, checks and tests the package
# and publishes nothing, because the tag check only has a tag to check when
# one was pushed.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation

      - name: Check what PyPI would be shown
        run: python -m twine check dist/*

      - name: The tag has to be the version
        # A tag that says one thing and a package that says another puts a
        # release on PyPI under a number nobody chose, and a number on PyPI
        # can never be used again.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF#refs/tags/v}"
          built=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tagged" != "$built" ]; then
            echo "tag v$tagged does not match version $built in pyproject.toml"
            exit 1
          fi

      - name: Run the suite before anything is published
        run: |
          python -m pip install --require-hashes -r .github/requirements/test.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest tests -q

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only for a pushed tag. A run started by hand, even on a tag, uploaded
    # whatever version pyproject.toml held, and a version on PyPI can never
    # be used again.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The environment is where PyPI's trusted publisher is pinned, and where
    # a required reviewer can be added if a release should need one.
    environment:
      name: pypi
      url: https://pypi.org/p/pysqlbridge
    permissions:
      # What lets GitHub mint the short-lived token PyPI checks. Nothing else
      # in this file needs it, and nothing else gets it.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
