name: CI

# The suite on every Python the package says it supports, and the package
# built and tested as PyPI would receive it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # requires-python claims 3.10 and up, and a claim nobody runs is a guess.
  # The protocol and SQL layers are portable and their tests run anywhere;
  # Windows Authentication is not, which is why the matrix has both.
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        # Minor versions, not patches: the matrix tests each supported
        # Python as users install it, at its newest patch release. On
        # Windows that is 3.12.10 for 3.12, which ships fixes as source only.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test tools, then the package
        run: |
          python -m pip install --require-hashes -r .github/requirements/test.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run the suite
        run: python -m pytest tests -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install the build tools
        run: python -m pip install --require-hashes -r .github/requirements/build.txt

      - name: Build the wheel and the sdist
        run: python -m build --no-isolation

      - name: Check what PyPI would be shown
        run: python -m twine check dist/*

      # An sdist that ships a test suite it cannot run is worse than one
      # that ships none, and only unpacking it says which this is.
      - name: Run the suite out of the sdist
        run: |
          python -m pip install --require-hashes -r .github/requirements/test.txt
          mkdir unpacked
          tar -xzf dist/*.tar.gz -C unpacked --strip-components=1
          cd unpacked
          python -m pip install --no-deps --no-build-isolation .
          python -m pytest tests -q

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The one check the main ruleset requires. The matrix jobs are named after
  # their Python and runner, which change; this name does not. It fails unless
  # every job above passed, a skipped one included.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
