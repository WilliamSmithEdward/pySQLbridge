# CodeQL for the Security workflow: GitHub's security-extended queries over
# the package, the workflows that build and publish it, and the script that
# holds the scans to the accepted list. Tests, the fuzz harness and the
# developer scripts are left out: they run only on a maintainer's machine or
# in CI, on input the repository holds. Each path is a folder, since the
# Python extractor walks folders and fails on a file.
name: pySQLbridge security

queries:
  - uses: security-extended

paths:
  - src
  - .github
  - scripts/security
